<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9C296"/>
      <stop offset="0.5" stop-color="#C5A66A"/>
      <stop offset="1" stop-color="#A8884C"/>
    </linearGradient>
  </defs>
  <!-- Navy roundel -->
  <circle cx="60" cy="60" r="56" fill="#092B60"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
